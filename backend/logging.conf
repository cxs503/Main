# Open Digital Foundation - Logging Configuration

# 日志目录
LOG_DIR=/var/log/open-foundation

# 日志文件大小限制 (50MB)
LOG_MAX_SIZE=52428800

# 日志文件保留数量
LOG_BACKUP_COUNT=10

# 日志格式
LOG_FORMAT=%(asctime)s - %(name)s - %(levelname)s - %(message)s

# Python日志配置
[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=simpleFormatter
args=('/var/log/open-foundation/backend.log', 'a', 52428800, 10)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
