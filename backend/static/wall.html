<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TensorEco 实况</title>
<style>
:root{--bg:#0b0f17;--panel:#121826;--line:#1e2736;--txt:#dbe4f0;--dim:#7a8aa0;
--ok:#34d399;--run:#60a5fa;--warn:#fbbf24;--bad:#f87171;--acc:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:18px}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
h1{font-size:20px;letter-spacing:1px}
h1 .sub{color:var(--dim);font-size:12px;margin-left:10px;font-weight:400}
#clock{color:var(--dim);font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.card .n{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.card .t{color:var(--dim);font-size:12px}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;min-width:0}
.panel h2{font-size:14px;color:var(--dim);margin-bottom:8px;font-weight:600;letter-spacing:.5px}
.run-card{border-left:3px solid var(--run);padding:6px 10px;margin-bottom:8px;background:#0e1522;border-radius:6px}
.run-card .g{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.meta{color:var(--dim);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--dim);font-weight:500}
td.g{white-space:normal;min-width:220px}
.badge{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px}
.s-succeeded{background:#052e1c;color:var(--ok)}.s-running{background:#0b2547;color:var(--run)}
.s-queued,.s-awaiting_acceptance{background:#3b2f0b;color:var(--warn)}
.s-failed{background:#3d0f14;color:var(--bad)}.s-stopped{background:#2b2b31;color:var(--dim)}
.rep{padding:9px 10px;border-radius:8px;margin-bottom:8px;background:#0e1522;cursor:pointer;border:1px solid transparent}
.rep:hover{border-color:var(--acc)}
.rep .id{color:var(--acc);font-size:12px}
.rep .tt{font-weight:600;margin:2px 0}
.rep .sm{color:var(--dim);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#overlay{position:fixed;inset:0;background:rgba(5,8,14,.82);display:none;overflow:auto;padding:40px 16px;z-index:9}
#overlay.on{display:block}
.reader{max-width:960px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 32px}
.reader h2{margin-bottom:4px;color:#fff;font-size:19px}
.reader .meta{margin-bottom:14px}
.reader .md{border-top:1px solid var(--line);padding-top:14px}
.reader .md h1,.reader .md h2,.reader .md h3{margin:16px 0 8px;color:#fff}
.reader .md p{margin:8px 0}.reader .md li{margin:4px 0 22px}
.reader .md table{margin:10px 0}.reader .md pre{background:#0b0f17;padding:12px;border-radius:8px;overflow:auto;margin:10px 0}
.reader .md code{background:#0b0f17;padding:1px 5px;border-radius:4px;font-size:12.5px}
.reader .md img{max-width:100%;border-radius:8px;margin:6px 0}
.reader .md blockquote{border-left:3px solid var(--acc);padding-left:12px;color:var(--dim)}
.figcap{color:var(--dim);font-size:12px;text-align:center;margin-bottom:14px}
#close{float:right;cursor:pointer;color:var(--dim);font-size:22px;line-height:1}
#close:hover{color:var(--bad)}
#pulse{color:var(--ok);font-size:11px}
.tag{display:inline-block;background:#0b2547;color:var(--run);border-radius:8px;padding:0 7px;font-size:11px;margin-right:4px}
</style>
</head>
<body>
<header>
  <h1>TensorEco 平台实况<span class="sub">agent 自主开发运行台 · 只读展示</span></h1>
  <div><span id="pulse">●</span> <span id="clock"></span></div>
</header>
<div class="cards" id="cards"></div>
<div class="cols">
  <div>
    <div class="panel"><h2>运行中</h2><div id="running"></div></div>
    <div class="panel"><h2>mission 流水</h2><div style="overflow:auto"><table id="flow"><thead><tr><th>#</th><th>状态</th><th>库</th><th>目标</th><th>模型</th><th>结束</th></tr></thead><tbody></tbody></table></div></div>
  </div>
  <div class="panel"><h2>最新报告（点击阅读）</h2><div id="reports"></div></div>
</div>
<div id="overlay"><div class="reader"><span id="close">✕</span><h2 id="r-title"></h2><div class="meta" id="r-meta"></div><div class="md" id="r-md"></div></div></div>
<script src="/api/v1/public/marked.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const fmt=t=>t?new Date(t).toLocaleString("zh-CN",{hour12:false}):"—";
const ago=t=>{if(!t)return"—";const s=(Date.now()-new Date(t))/1e3;
  if(s<90)return Math.round(s)+" 秒前";if(s<5400)return Math.round(s/60)+" 分前";
  if(s<172800)return Math.round(s/3600)+" 小时前";return Math.round(s/86400)+" 天前"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function poll(){
  try{
    const [ov,ms,rp]=await Promise.all([
      fetch("/api/v1/public/overview").then(r=>r.json()),
      fetch("/api/v1/public/missions?limit=40").then(r=>r.json()),
      fetch("/api/v1/public/reports?limit=25").then(r=>r.json())]);
    const c=ov.status_counts||{};
    $("#cards").innerHTML=[
      ["运行中",(c.running||0),"var(--run)"],["排队/待批",(c.queued||0)+(c.awaiting_acceptance||0),"var(--warn)"],
      ["24h 成功",ov.succeeded_24h,"var(--ok)"],["24h 失败",ov.failed_24h,"var(--bad)"],
      ["累计成功",c.succeeded||0,"var(--ok)"],["报告",ov.reports_total,"var(--acc)"]]
      .map(([t,n,col])=>`<div class="card"><div class="n" style="color:${col}">${n}</div><div class="t">${t}</div></div>`).join("");
    $("#running").innerHTML=(ov.running||[]).map(m=>
      `<div class="run-card"><div class="g" title="${esc(m.goal)}">${esc((m.goal||"").split("\n")[0])}</div>
       <div class="meta"><span>m${m.id}</span><span>${esc(m.repo)}</span><span>${esc(m.model||"")}</span>
       <span>心跳 ${ago(m.heartbeat_at||m.created_at)}</span><span>${esc((m.claimed_by||"").replace("tensor-agent[","").split("]")[0])}</span></div></div>`
    ).join("")||'<div class="meta">（无在跑任务）</div>';
    document.querySelector("#flow tbody").innerHTML=(ms||[]).map(m=>
      `<tr><td>m${m.id}</td><td><span class="badge s-${esc(m.status)}">${esc(m.status)}</span></td>
       <td>${esc(m.repo)}</td><td class="g">${esc((m.goal||"").split("\n")[0])}</td>
       <td>${esc(m.model||"")}</td><td>${ago(m.finished_at)}</td></tr>`).join("");
    $("#reports").innerHTML=(rp||[]).map(r=>
      `<div class="rep" onclick="openRep(${r.id})"><span class="id">#${r.id}</span>
       <div class="tt">${esc(r.title)}</div><div class="sm">${esc(r.summary)}</div>
       <div class="meta" style="margin-top:4px">${ago(r.created_at)}${(r.tags||[]).slice(0,3).map(t=>` <span class="tag">${esc(t)}</span>`).join("")}</div></div>`
    ).join("")||'<div class="meta">（暂无报告）</div>';
    $("#pulse").textContent="●";$("#pulse").style.color="var(--ok)";
  }catch(e){$("#pulse").textContent="○";$("#pulse").style.color="var(--bad)"}
  $("#clock").textContent=new Date().toLocaleString("zh-CN",{hour12:false});
}
async function openRep(id){
  const r=await fetch("/api/v1/public/reports/"+id).then(x=>x.json());
  $("#r-title").textContent=r.title;
  $("#r-meta").innerHTML=`<span>#${r.id}</span><span>${fmt(r.created_at)}</span>`+
    (r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  const md=(window.marked&&r.markdown)?marked.parse(r.markdown):`<pre>${esc(r.markdown)}</pre>`;
  const figs=(r.figures||[]).map(f=>`<figure><img src="data:image/png;base64,${f.png_base64}" alt="${esc(f.name)}"><figcaption class="figcap">${esc(f.caption||f.name)}</figcaption></figure>`).join("");
  $("#r-md").innerHTML=md+(figs?`<h3>图件（${r.figures.length}）</h3>`+figs:"");
  $("#overlay").classList.add("on");$("#overlay").scrollTop=0;
}
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay"||e.target.id==="close")$("#overlay").classList.remove("on")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#overlay").classList.remove("on")});
poll();setInterval(poll,15000);
</script>
</body>
</html>
