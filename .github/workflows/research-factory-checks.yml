name: Research Factory checks

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/api/research_factory.py"
      - "backend/tests/test_research_factory.py"
      - "backend/api/domain/misc.py"
      - "frontend-vue/src/views/research/ResearchFactory.vue"
      - "frontend-vue/src/api/request.ts"
      - ".github/workflows/research-factory-checks.yml"
  workflow_dispatch:

jobs:
  backend-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "fastapi==0.104.1" "pydantic==2.5.0" pytest
      - run: PYTHONPATH=. pytest --noconftest -q tests/test_research_factory.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - run: npm ci
      # Run the bundler even when the repository-wide legacy type-check has unrelated errors.
      - run: npm run build
      - run: npm run type-check
