name: Resident community
on:
  pull_request:
    paths:
      - 'backend/api/tensor_*.py'
      - 'backend/api/domain/__init__.py'
      - 'backend/**/factory*'
      - 'backend/**/soul_*.py'
      - 'backend/migrations/09*_factory_*.sql'
      - 'backend/migrations/09*_soul_*.sql'
      - 'tools/factory/**'
      - 'tests/factory/**'
      - 'scripts/*factory*'
      - 'scripts/*resident*'
      - 'scripts/*platform_workspace*'
      - 'scripts/verify_soul_phase1.py'
      - 'requirements-factory*.txt'
      - 'frontend-factory/**'
      - 'deploy/*sandbox.py'
      - 'deploy/platform*'
      - '.github/workflows/resident-community.yml'
  push:
    branches: [main]
jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-factory-dev.txt
      - run: python -m pytest tests/factory -q --junitxml=resident-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resident-tests
          path: resident-tests.xml
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-factory/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
