global:
  resolve_timeout: 5m

route:
  receiver: foundation-platform-webhook
  group_by:
    - alertname
    - service
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      repeat_interval: 1h

receivers:
  - name: foundation-platform-webhook
    webhook_configs:
      - url: http://backend:8001/api/v1/internal/alertmanager/webhook
        send_resolved: true
        max_alerts: 100
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alertmanager_webhook_token

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - service
