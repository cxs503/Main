# TensorPlatform frontend: SPA + API reverse proxy (upstream release omitted this file)
server {
    listen 3000;
    server_name _;

    client_max_body_size 512m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # container healthcheck endpoint (compose healthcheck + jump tunnel probe)
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # API + FastAPI docs through to backend service
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    # 实况大屏：根路径免登录展示（owner 2026-10-22——平台仅作实况展示入口）；
    # SPA 控制台仍在既有路由可达（深链入口，无导航指向）
    location = / {
        proxy_pass http://backend:8001/api/v1/public/wall;
        proxy_set_header Host $host;
    }

    # Vue SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
    }
}
