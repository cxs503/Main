# Prometheus 抓取配置 — 开放数字化底座
# 全局抓取间隔 15s
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'open-foundation-monitor'

# 告警规则由仓库管理，容器内以只读方式挂载。
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Notification dispatch. Start the Alertmanager Compose profile before reloading
# this configuration; Prometheus rule evaluation remains independent if it is down.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# 抓取目标
scrape_configs:
  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  # 开放底座AI 后端 (FastAPI /metrics 端点)
  - job_name: 'foundation-backend'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'backend:8001'
        labels:
          service: 'backend'
          app: 'open-foundation'
