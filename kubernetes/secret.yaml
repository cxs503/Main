# Open Digital Foundation敏感配置
# 使用方法: kubectl apply -f secret.yaml
# 注意: 实际部署时应使用SealedSecret或外部密钥管理服务

apiVersion: v1
kind: Secret
metadata:
  name: foundation-secrets
  namespace: open-foundation
type: Opaque
stringData:
  # PostgreSQL密码
  POSTGRES_PASSWORD: "foundation123"
  # Redis密码 (如需要)
  REDIS_PASSWORD: ""
  # MinIO凭证
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  # OpenRouter API Key (从环境变量注入)
  OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
  # JWT密钥
  JWT_SECRET_KEY: "your-secret-key-change-in-production"
