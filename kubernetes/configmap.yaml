# Open Digital Foundation配置
# 使用方法: kubectl apply -f configmap.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: foundation-config
  namespace: open-foundation
data:
  DATABASE_URL: "postgresql://foundation:foundation123@postgres:5432/open_digital_foundation"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "open-foundation"
  USE_MINIO: "true"
  LOG_LEVEL: "info"
