# Kustomization配置
# 使用方法: kubectl apply -k .

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: open-foundation

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - minio.yaml
  - backend.yaml
  - ingress.yaml

commonLabels:
  app: open-digital-foundation
